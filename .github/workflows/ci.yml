name: CI Pipeline - Tag Human Universal

# 1. DISPARADORES (TRIGGERS)
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  validate-and-build:
    name: Validación Integral
    runs-on: ubuntu-latest

    # Variables de entorno mínimas para que docker compose config y build pasen
    env:
      DB_USER: postgres
      DB_PASSWORD: ci_password
      DB_NAME: taghuman
      DB_PORT: 5432
      DB_SSL: false
      PORT: 3000
      JWT_SECRET: ci_secret_only_for_build
      ACCESS_TOKEN_EXPIRES: 15m
      REFRESH_TOKEN_DAYS: 7
      NODE_ENV: production
      VITE_API_URL: http://localhost:3000/api

    steps:
      # Descargar el código
      - name: Checkout del Código
        uses: actions/checkout@v4

      # Configurar Node con caché para instalaciones más rápidas
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # Verificar dependencias
      - name: Instalar Dependencias
        run: |
          echo "Verificando Backend..."
          cd backend && npm install --ignore-scripts
          echo "Verificando Frontend..."
          cd ../frontend && npm install --ignore-scripts

      # Linter
      - name: Validar Calidad de Código (Linter)
        run: |
          echo "Ejecutando Linter en Backend..."
          cd backend && npm run lint || echo "No hay script de lint en backend"
          echo "Ejecutando Linter en Frontend..."
          cd ../frontend && npm run lint

      # Validar sintaxis de docker-compose
      - name: Validar Syntax Docker Compose
        run: docker compose config

      # Construir imágenes Docker
      - name: Build Docker Images
        run: docker compose build
